<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff0f5">
<title>合成花宝宝</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }

  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px;
    background:
      radial-gradient(circle at 20% 10%, #fff5f8 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, #f0f7ff 0%, transparent 50%),
      linear-gradient(135deg, #ffeef5 0%, #f7f0ff 50%, #eaf4ff 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    position: relative;
    touch-action: manipulation;
    color: #5a4a52;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(255, 200, 220, 0.5), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(210, 220, 255, 0.45), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(255, 220, 235, 0.45), transparent 55%);
    pointer-events: none;
    z-index: 0;
    animation: breathe 9s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }

  .splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 40%, #fff5f8 0%, #ffe4ef 45%, #f0d8e8 100%);
    pointer-events: none;
    animation: splashOut 0.9s ease-out 1.5s forwards;
  }
  @keyframes splashOut {
    0% { opacity: 1; visibility: visible; }
    100% { opacity: 0; visibility: hidden; }
  }
  .splash-inner {
    position: relative;
    text-align: center;
    animation: splashInnerUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes splashInnerUp {
    0% { transform: translateY(30px); opacity: 0; }
    60% { opacity: 1; }
    100% { transform: translateY(-10px); opacity: 1; }
  }
  .splash-icon {
    font-size: 72px;
    line-height: 1;
    filter: drop-shadow(0 10px 24px rgba(255, 120, 160, 0.45));
    animation: iconPop 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes iconPop {
    0% { transform: scale(0.2) rotate(-30deg); opacity: 0; }
    55% { transform: scale(1.15) rotate(8deg); opacity: 1; }
    75% { transform: scale(0.95) rotate(-3deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .splash-title {
    margin-top: 18px;
    font-size: 26px;
    font-weight: 800;
    color: #d94a76;
    letter-spacing: 8px;
    font-family: "PingFang SC", "STKaiti", "KaiTi", serif;
    text-shadow: 0 1px 0 #fff, 0 4px 16px rgba(255, 120, 160, 0.4);
    opacity: 0;
    animation: titleIn 0.9s ease-out 0.35s forwards;
  }
  @keyframes titleIn {
    0% { opacity: 0; transform: translateY(12px); letter-spacing: 20px; }
    100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
  }
  .splash-line {
    margin: 18px auto 0;
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e88aa8, transparent);
    animation: lineGrow 1s ease-out 0.7s forwards;
  }
  @keyframes lineGrow {
    0% { width: 0; opacity: 0; }
    100% { width: 120px; opacity: 1; }
  }
  .splash-petals {
    position: absolute;
    inset: -200px -100px;
    pointer-events: none;
    overflow: hidden;
  }
  .splash-petal {
    position: absolute;
    font-size: 20px;
    opacity: 0;
    animation: petalDrift 3s ease-in forwards;
  }
  @keyframes petalDrift {
    0% { opacity: 0; transform: translateY(0) rotate(0deg); }
    20% { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(220px) rotate(360deg); }
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 100%;
    opacity: 0;
    animation: appIn 0.9s ease-out 1.5s forwards;
  }
  @keyframes appIn {
    0% { opacity: 0; transform: translateY(20px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .topbar {
    text-align: center;
    padding: 8px 16px 12px;
  }
  .topbar h1 {
    font-size: 22px;
    color: #d94a76;
    letter-spacing: 6px;
    font-weight: 800;
    font-family: "PingFang SC", "STKaiti", "KaiTi", serif;
    text-shadow: 0 1px 0 #fff, 0 2px 8px rgba(255, 140, 180, 0.35);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .topbar h1::before,
  .topbar h1::after {
    content: "";
    width: 28px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e88aa8, transparent);
  }

  .main {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    width: 100%;
    max-width: 900px;
  }
  .left-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .right-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .mobile-stats {
    display: none;
    gap: 6px;
    width: 100%;
    flex-shrink: 0;
  }
  .mobile-stats .stat-card {
    flex: 1;
    background: linear-gradient(180deg, #ffffff 0%, #fff8fb 100%);
    border-radius: 16px;
    padding: 8px 6px;
    text-align: center;
    box-shadow:
      inset 0 0 0 1px rgba(255, 210, 225, 0.9),
      0 4px 12px rgba(255, 180, 210, 0.18);
    position: relative;
    overflow: visible;
  }
  .mobile-stats .stat-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(90deg, transparent, #ffc2d6, transparent);
  }
  .mobile-stats .stat-card .label {
    font-size: 10px;
    color: #c99;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }
  .mobile-stats .stat-card .value {
    font-size: 20px;
    font-weight: 800;
    color: #d94a76;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    transition: transform 0.2s ease;
  }
  .mobile-stats .stat-card .value.pop {
    animation: pop 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); color: #ff7a1a; }
    100% { transform: scale(1); }
  }
  .mobile-stats .stat-card.score-pop {
    animation: scoreCardPop 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes scoreCardPop {
    0% { transform: scale(1); }
    40% {
      transform: scale(1.08);
      box-shadow:
        inset 0 0 0 2px #ffb3cd,
        0 10px 24px rgba(255, 120, 160, 0.45);
    }
    100% { transform: scale(1); }
  }
  .mobile-stats .stat-card .score-tip {
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    font-weight: 800;
    font-size: 22px;
    color: #ff6b95;
    text-shadow: 0 2px 0 #fff, 0 0 10px rgba(255, 130, 170, 0.85);
    animation: scoreTipUp 0.9s ease-out forwards;
    pointer-events: none;
    white-space: nowrap;
    z-index: 3;
  }
  @keyframes scoreTipUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
    25% { opacity: 1; transform: translate(-50%, -12px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -55px) scale(1); }
  }

  /* 画布外框：宽高由 JS 控制，这里不写 width/height */
  .game-wrap {
    position: relative;
    border-radius: 18px;
    padding: 0;
    background: transparent;
    box-shadow:
      0 0 0 1px rgba(255, 200, 220, 0.7),
      0 0 0 4px rgba(255, 255, 255, 0.6),
      0 16px 40px rgba(255, 160, 190, 0.22);
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .game-wrap.shake { animation: shake 0.28s ease; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-3px, -2px); }
    80% { transform: translate(3px, 2px); }
  }

  /* 关键：canvas 不写 width/height，全部由 JS 内联样式控制 */
  canvas {
    display: block;
    border-radius: 18px;
    background: #fff9ec;
    box-shadow:
      inset 0 0 60px rgba(255, 210, 225, 0.6),
      0 0 0 1px rgba(255, 200, 220, 0.4);
    touch-action: none;
    cursor: pointer;
  }

  .sign-icon {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 40px;
    height: 40px;
    object-fit: contain;
    transform: rotate(-45deg);
    z-index: 8;
    pointer-events: none;
    filter: drop-shadow(0 4px 8px rgba(255, 140, 180, 0.5));
  }

  .next-badge {
    display: none;
    position: absolute;
    top: 14px;
    right: 14px;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 10px 7px;
    background: rgba(255, 255, 255, 0.98);
    border-radius: 14px;
    box-shadow:
      inset 0 0 0 2px rgba(255, 170, 200, 0.9),
      0 8px 20px rgba(255, 120, 160, 0.4),
      0 0 0 4px rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 7;
    pointer-events: none;
  }
  .next-badge .label {
    font-size: 10px;
    color: #d97aa0;
    letter-spacing: 2px;
    line-height: 1;
    font-weight: 700;
  }
  .next-badge img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 3px 6px rgba(255, 140, 180, 0.45));
  }

  .aim-line {
    position: absolute;
    top: 0;
    width: 2px;
    height: 0;
    background: linear-gradient(180deg, #ffb3cd 0%, #ff6b95 100%);
    opacity: 0.75;
    pointer-events: none;
    z-index: 3;
    display: none;
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(255, 110, 150, 0.5);
  }

  .floating-preview {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px dashed #ff8fb1;
    background: rgba(255, 255, 255, 0.95);
    box-shadow:
      0 6px 18px rgba(255, 107, 149, 0.35),
      inset 0 0 0 2px rgba(255, 255, 255, 0.6);
    pointer-events: none;
    z-index: 4;
    display: none;
    overflow: hidden;
  }
  .floating-preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
  }

  .panel {
    width: 340px;
    background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,250,252,0.92) 100%);
    border-radius: 24px;
    padding: 14px 16px 16px;
    box-shadow:
      0 0 0 1px rgba(255, 200, 220, 0.7),
      0 0 0 5px rgba(255, 255, 255, 0.55),
      0 20px 50px rgba(255, 170, 200, 0.22),
      0 6px 18px rgba(180, 200, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
  }

  .panel-top-stats {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    width: 100%;
  }
  .panel-top-stats .stat-box {
    flex: 1;
    background: linear-gradient(180deg, #ffffff 0%, #fff8fb 100%);
    border-radius: 14px;
    padding: 8px 6px;
    text-align: center;
    box-shadow:
      inset 0 0 0 1px rgba(255, 210, 225, 0.9),
      0 4px 12px rgba(255, 180, 210, 0.18);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 62px;
  }
  .panel-top-stats .stat-box::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 14px 14px 0 0;
    background: linear-gradient(90deg, transparent, #ffc2d6, transparent);
  }
  .panel-top-stats .stat-box .label {
    font-size: 10px;
    color: #c99;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }
  .panel-top-stats .stat-box .value {
    font-size: 20px;
    font-weight: 800;
    color: #d94a76;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .panel-top-stats .stat-box .value.pop {
    animation: pop 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .panel-top-stats .next-box img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 2px 5px rgba(255, 140, 180, 0.35));
  }

  .sound-toggle {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    background: #fff5fa;
    border-radius: 50%;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(255, 120, 160, 0.2);
    z-index: 6;
    transition: transform 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .sound-toggle:active { transform: scale(0.9); }
  .sound-toggle.off { opacity: 0.55; }

  .panel-tag {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 20px;
    margin-bottom: 10px;
    padding: 0 32px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #d88aa8;
    font-family: "PingFang SC", "STKaiti", "KaiTi", serif;
    animation: quoteFade 0.6s ease;
    text-align: center;
  }
  .panel-tag span {
    line-height: 1.4;
    display: block;
  }
  @keyframes quoteFade {
    0% { opacity: 0; transform: translateY(-4px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  #comboBadge {
    display: none;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #ff9a3c, #ff4d7e);
    border-radius: 12px;
    padding: 7px;
    margin-bottom: 10px;
    box-shadow: 0 6px 16px rgba(255, 77, 126, 0.35);
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }
  #comboBadge::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shine 1.5s linear infinite;
  }
  @keyframes shine {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  .goal-box {
    background: linear-gradient(180deg, #f8fcff 0%, #f0f8ff 100%);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow:
      inset 0 0 0 1px rgba(200, 225, 245, 0.8),
      0 4px 10px rgba(180, 210, 240, 0.15);
  }
  .goal-box h4 {
    font-size: 11px;
    color: #7aa8c8;
    margin-bottom: 8px;
    letter-spacing: 3px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .goal-box h4::before,
  .goal-box h4::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c5ddef, transparent);
  }
  .goal-item {
    font-size: 12px;
    color: #5a6a78;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 8px;
  }
  .goal-item:last-child { margin-bottom: 0; }
  .goal-item .goal-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .goal-item .goal-progress {
    font-weight: 700;
    color: #7aa8c8;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .goal-item.done { color: #2aa06a; }
  .goal-item.done .goal-progress { color: #2aa06a; }
  .goal-bar {
    height: 5px;
    background: #e5eef5;
    border-radius: 3px;
    overflow: hidden;
  }
  .goal-bar > i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #a8d5ee, #7aa8c8);
    transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    border-radius: 3px;
  }
  .goal-item.done .goal-bar > i {
    background: linear-gradient(90deg, #7ee0a8, #2aa06a);
  }

  #restartBtn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff8fb1 0%, #ff4d7e 100%);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow:
      0 8px 20px rgba(255, 77, 126, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
    letter-spacing: 3px;
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  #restartBtn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: shine 2.5s ease-in-out infinite;
  }
  #restartBtn:active {
    transform: scale(0.97);
    box-shadow: 0 4px 12px rgba(255, 77, 126, 0.5);
  }

  .tip {
    margin-top: 12px;
    font-size: 10px;
    line-height: 1.8;
    color: #b5a5ab;
    text-align: center;
    letter-spacing: 0.5px;
  }

  #heartContainer {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100dvh;
    pointer-events: none;
    overflow: hidden;
    z-index: 9;
  }
  .heart {
    position: absolute;
    font-size: 22px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100dvh) rotate(360deg); opacity: 0; }
  }

  #floatLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 12;
    overflow: hidden;
  }
  .float-text {
    position: absolute;
    font-weight: 800;
    color: #ff4d7e;
    text-shadow: 0 2px 0 #fff, 0 0 12px rgba(255, 120, 160, 0.8);
    animation: floatUp 0.95s ease-out forwards;
    white-space: nowrap;
    font-size: 20px;
    font-family: "PingFang SC", "STKaiti", serif;
  }
  .float-text.combo {
    color: #ff7a1a;
    font-size: 28px;
    text-shadow: 0 2px 0 #fff, 0 0 16px rgba(255, 140, 40, 0.9);
  }
  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
    25% { transform: translate(-50%, -12px) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -70px) scale(1); opacity: 0; }
  }

  .burst-particle {
    position: absolute;
    font-size: 16px;
    pointer-events: none;
    z-index: 11;
    animation: burstFly 0.7s ease-out forwards;
    will-change: transform, opacity;
  }
  @keyframes burstFly {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1);
    }
  }

  .click-pulse {
    position: absolute;
    width: 40px; height: 40px;
    border: 2px solid #ff6b95;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: pulseRing 0.6s ease-out forwards;
    pointer-events: none;
    z-index: 11;
  }
  @keyframes pulseRing {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
  }

  .merge-flash {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ffd6e7 40%, transparent 70%);
    transform: translate(-50%, -50%);
    animation: flashOut 0.5s ease-out forwards;
    pointer-events: none;
    z-index: 11;
  }
  @keyframes flashOut {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }

  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100dvh;
    background: radial-gradient(circle at center, rgba(255, 200, 220, 0.3), rgba(0, 0, 0, 0.45));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 15;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .modal-box {
    background: linear-gradient(180deg, #ffffff 0%, #fff9fc 100%);
    border-radius: 28px;
    padding: 40px 28px 28px;
    text-align: center;
    width: 100%;
    max-width: 340px;
    box-shadow:
      0 0 0 1px rgba(255, 200, 220, 0.7),
      0 0 0 6px rgba(255, 255, 255, 0.6),
      0 30px 60px rgba(255, 130, 170, 0.3);
    position: relative;
    animation: modalIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes modalIn {
    0% { transform: scale(0.85) translateY(20px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal-box::before {
    content: "🌸";
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff 0%, #fff5fa 100%);
    box-shadow:
      0 0 0 3px #fff,
      0 0 0 4px rgba(255, 200, 220, 0.7),
      0 6px 14px rgba(255, 140, 180, 0.3);
    font-size: 20px;
    line-height: 44px;
    text-align: center;
    padding: 0;
    letter-spacing: 0;
  }
  .modal-emoji {
    font-size: 56px;
    line-height: 1;
    margin-bottom: 8px;
    animation: emojiPop 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    filter: drop-shadow(0 4px 12px rgba(255, 140, 180, 0.35));
  }
  @keyframes emojiPop {
    0% { transform: scale(0.3) rotate(-20deg); }
    60% { transform: scale(1.2) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .modal-box h2 {
    color: #d94a76;
    margin-bottom: 8px;
    font-size: 17px;
    letter-spacing: 4px;
    font-weight: 500;
  }
  .modal-big-score {
    font-size: 56px;
    font-weight: 800;
    color: #ff4d7e;
    text-shadow: 0 0 24px rgba(255, 120, 160, 0.6), 0 2px 0 #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-family: "PingFang SC", "STKaiti", serif;
  }
  .modal-sub {
    font-size: 11px;
    color: #c99;
    margin: 6px 0 14px;
    letter-spacing: 4px;
  }
  .modal-quote {
    font-size: 13px;
    color: #d88aa8;
    margin-bottom: 18px;
    line-height: 1.7;
    font-family: "PingFang SC", "STKaiti", "KaiTi", serif;
    letter-spacing: 1px;
    padding: 0 6px;
  }
  .modal-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 22px;
  }
  .modal-stat {
    background: linear-gradient(180deg, #fff 0%, #fff5fa 100%);
    border-radius: 14px;
    padding: 10px 8px;
    box-shadow: inset 0 0 0 1px rgba(255, 210, 225, 0.7);
  }
  .modal-stat span:first-child {
    display: block;
    font-size: 10px;
    color: #c99;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .modal-stat span:last-child {
    font-size: 18px;
    font-weight: 700;
    color: #d94a76;
    font-variant-numeric: tabular-nums;
  }
  .modal-box button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #ff8fb1 0%, #ff4d7e 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 4px;
    box-shadow:
      0 8px 20px rgba(255, 77, 126, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.4);
    transition: transform 0.15s ease;
    position: relative;
    overflow: hidden;
  }
  .modal-box button::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: shine 2.5s ease-in-out infinite;
  }
  .modal-box button:active { transform: scale(0.97); }

  .love-transition {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .love-transition.show { opacity: 1; visibility: visible; }
  .love-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%,
        rgba(255, 210, 230, 0.9) 0%,
        rgba(255, 180, 210, 0.6) 25%,
        rgba(255, 220, 240, 0.3) 50%,
        rgba(255, 240, 250, 0) 75%);
    opacity: 0;
    transform: scale(0.6);
  }
  .love-transition.show .love-glow {
    animation: glowIn 1.2s ease-out forwards;
  }
  @keyframes glowIn {
    0% { opacity: 0; transform: scale(0.6); }
    60% { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  .love-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 0 20px;
  }
  .love-img-wrap {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle, #fff 0%, #ffe4ef 70%, #ffd0e0 100%);
    box-shadow:
      0 0 0 6px rgba(255, 255, 255, 0.7),
      0 0 50px 16px rgba(255, 130, 170, 0.6),
      0 0 100px 32px rgba(255, 180, 210, 0.4);
    opacity: 0;
    transform: scale(0.3) rotate(-25deg);
  }
  .love-transition.show .love-img-wrap {
    animation: imgPop 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
  }
  @keyframes imgPop {
    0% { opacity: 0; transform: scale(0.3) rotate(-25deg); }
    55% { opacity: 1; transform: scale(1.15) rotate(6deg); }
    75% { transform: scale(0.96) rotate(-3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .love-img-wrap img {
    width: 78%;
    height: 78%;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 6px 14px rgba(255, 90, 140, 0.45));
  }
  .love-text {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 8px;
    color: #ff4d7e;
    font-family: "PingFang SC", "STKaiti", "KaiTi", serif;
    text-shadow:
      0 0 12px rgba(255, 150, 185, 0.9),
      0 0 28px rgba(255, 100, 150, 0.7),
      0 0 56px rgba(255, 80, 130, 0.5),
      0 4px 0 rgba(255, 255, 255, 0.9);
    opacity: 0;
    transform: translateY(24px) scale(0.9);
  }
  .love-transition.show .love-text {
    animation: textRise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.9s forwards;
  }
  @keyframes textRise {
    0% { opacity: 0; transform: translateY(24px) scale(0.9); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .love-burst {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    z-index: 1;
  }
  .love-particle {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 22px;
    opacity: 0;
    will-change: transform, opacity;
  }
  .love-transition.show .love-particle {
    animation: particleFly 1.6s ease-out forwards;
  }
  @keyframes particleFly {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(0deg); }
    20% { opacity: 1; }
    100% {
      opacity: 0;
      transform:
        translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
        scale(1.1) rotate(var(--rot));
    }
  }
  .love-transition.gold .love-glow {
    background:
      radial-gradient(circle at 50% 50%,
        rgba(255, 230, 170, 0.9) 0%,
        rgba(255, 200, 100, 0.6) 25%,
        rgba(255, 220, 160, 0.3) 50%,
        rgba(255, 240, 200, 0) 75%);
  }
  .love-transition.gold .love-img-wrap {
    background: radial-gradient(circle, #fff 0%, #fff0c8 70%, #ffd88a 100%);
    box-shadow:
      0 0 0 6px rgba(255, 255, 255, 0.75),
      0 0 50px 16px rgba(255, 180, 60, 0.6),
      0 0 100px 32px rgba(255, 140, 30, 0.4);
  }
  .love-transition.gold .love-img-wrap img {
    filter: drop-shadow(0 6px 14px rgba(255, 140, 30, 0.5));
  }
  .love-transition.gold .love-text {
    color: #ff3d2e;
    text-shadow:
      0 0 12px rgba(255, 220, 130, 0.95),
      0 0 28px rgba(255, 170, 50, 0.8),
      0 0 56px rgba(255, 110, 10, 0.6),
      0 4px 0 rgba(255, 255, 255, 0.9);
  }

  /* ========== 手机端：上下堆叠，画布高度由 JS 撑满 ========== */
  @media (max-width: 860px) {
    body {
      padding: 6px;
      height: 100dvh;
      overflow: hidden;
    }

    .app {
      gap: 6px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .topbar { display: none; }

    .main {
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .left-col,
    .right-col {
      align-items: stretch;
      gap: 6px;
      width: auto;
      flex-shrink: 0;
      margin-left: auto;
      margin-right: auto;
    }

    .mobile-stats {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .mobile-stats .stat-card {
      padding: 6px 6px;
      border-radius: 14px;
    }
    .mobile-stats .stat-card .label { font-size: 9px; }
    .mobile-stats .stat-card .value { font-size: 18px; }

    .goal-box { display: none !important; }
    #comboBadge { display: none !important; }
    .panel-top-stats { display: none !important; }

    .game-wrap {
      padding: 0;
      border-radius: 18px;
      box-sizing: border-box;
      box-shadow:
        0 0 0 1px rgba(255, 200, 220, 0.7),
        0 0 0 4px rgba(255, 255, 255, 0.6),
        0 12px 30px rgba(255, 160, 190, 0.25);
    }

    .next-badge { display: flex; }

    .sign-icon {
      width: 36px;
      height: 36px;
      top: 10px;
      left: 10px;
    }

    .panel {
      width: 100%;
      max-width: 100%;
      padding: 10px 12px 12px;
      border-radius: 14px;
    }
    .panel .tip { display: none; }

    .panel-tag {
      font-size: 12px;
      padding: 0 32px;
      margin-bottom: 10px;
      min-height: 20px;
    }

    #restartBtn {
      padding: 11px;
      font-size: 14px;
      letter-spacing: 2px;
      border-radius: 12px;
    }

    .sound-toggle {
      width: 24px;
      height: 24px;
      font-size: 11px;
      top: 6px;
      right: 6px;
    }

    #heartContainer { display: none !important; }
  }
</style>
</head>
<body>

  <div class="splash" id="splash">
    <div class="splash-petals" id="splashPetals"></div>
    <div class="splash-inner">
      <div class="splash-icon">💐</div>
      <div class="splash-title">合成花宝宝</div>
      <div class="splash-line"></div>
    </div>
  </div>

  <header class="topbar">
    <h1>💐 合成花宝宝</h1>
  </header>

  <div class="app">
    <main class="main">
      <div class="left-col" id="leftCol">
        <div class="mobile-stats" id="mobileStats">
          <div class="stat-card">
            <div class="label">分数</div>
            <div class="value" id="scoreMobile">0</div>
          </div>
          <div class="stat-card">
            <div class="label">最高</div>
            <div class="value" id="bestScoreMobile">0</div>
          </div>
        </div>

        <div class="game-wrap" id="gameWrap">
          <canvas id="gameCanvas"></canvas>
          <div class="aim-line" id="aimLine"></div>
          <div class="floating-preview" id="floatingPreview">
            <img id="previewImg" src="" alt="" />
          </div>

          <img class="sign-icon" src="img/qm.png" alt="" />

          <div class="next-badge">
            <span class="label">下一个</span>
            <img id="nextImgMobile" src="" alt="" />
          </div>
        </div>
      </div>

      <div class="right-col" id="rightCol">
        <div class="panel">
          <button class="sound-toggle" id="soundToggle" aria-label="音效开关">🔊</button>

          <div class="panel-top-stats">
            <div class="stat-box next-box">
              <span class="label">下一个</span>
              <img id="nextImg" src="" alt="" />
            </div>
            <div class="stat-box">
              <span class="label">分数</span>
              <span class="value" id="score">0</span>
            </div>
            <div class="stat-box">
              <span class="label">最高</span>
              <span class="value" id="bestScore">0</span>
            </div>
          </div>

          <div id="comboBadge">暴击 ×2</div>

          <div class="goal-box">
            <h4>本局目标</h4>
            <div id="goalList"></div>
          </div>

          <div class="panel-tag" id="panelTagWrap">
            <span id="panelTag">花宝宝，今天也超级想你</span>
          </div>

          <button id="restartBtn">重 新 开 始</button>

          <p class="tip">
            移动 / 拖动预览落点<br />
            点击投放，相同图片合成更大一级<br />
            连续合成触发暴击，分数翻倍<br />
            堆到红线上方游戏结束
          </p>
        </div>
      </div>
    </main>
  </div>

  <div id="heartContainer"></div>
  <div id="floatLayer"></div>

  <div class="modal" id="gameOverModal">
    <div class="modal-box">
      <div class="modal-emoji" id="overEmoji">😊</div>
      <h2>游 戏 结 束</h2>
      <div class="modal-big-score" id="finalScoreBig">0</div>
      <p class="modal-sub">本 局 得 分</p>
      <div class="modal-quote" id="finalQuote">花宝宝，你永远是我的满分答案💯</div>
      <div class="modal-stats">
        <div class="modal-stat"><span>最高暴击</span><span id="finalCombo">0</span></div>
        <div class="modal-stat"><span>合成次数</span><span id="finalMerges">0</span></div>
        <div class="modal-stat"><span>用时</span><span id="finalTime">0s</span></div>
        <div class="modal-stat"><span>历史最高</span><span id="finalBest">0</span></div>
      </div>
      <button id="closeOverBtn">再 来 一 局</button>
    </div>
  </div>

  <div class="love-transition" id="loveTransition">
    <div class="love-glow"></div>
    <div class="love-burst" id="loveBurst"></div>
    <div class="love-content">
      <div class="love-img-wrap">
        <img id="loveImg" src="" alt="" />
      </div>
      <div class="love-text" id="loveText">爱你宝宝</div>
    </div>
  </div>

  <div class="love-transition gold" id="callTransition">
    <div class="love-glow"></div>
    <div class="love-burst" id="callBurst"></div>
    <div class="love-content">
      <div class="love-img-wrap">
        <img id="callImg" src="" alt="" />
      </div>
      <div class="love-text" id="callText">叫爸爸</div>
    </div>
  </div>

  <script>
    (function () {
      const wrap = document.getElementById("splashPetals");
      if (!wrap) return;
      const petals = ["🌸", "💕", "✨", "🌷", "💖"];
      for (let i = 0; i < 14; i++) {
        const p = document.createElement("div");
        p.className = "splash-petal";
        p.textContent = petals[Math.floor(Math.random() * petals.length)];
        p.style.left = (10 + Math.random() * 80) + "%";
        p.style.top = (Math.random() * 40 - 10) + "%";
        p.style.animationDelay = (Math.random() * 1.2).toFixed(2) + "s";
        p.style.fontSize = (14 + Math.random() * 14) + "px";
        wrap.appendChild(p);
      }
      setTimeout(() => {
        const s = document.getElementById("splash");
        if (s) s.remove();
      }, 2600);
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
